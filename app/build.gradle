plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.olimpiafood.menu'
    compileSdk 34

    defaultConfig {
        applicationId "ru.olimpiafood.menu"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding 'UTF-8'
    }
}
